<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Quiz - PureMarine</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="ocean-bg">
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
</div>

<div class="page-wrapper">
  <div class="module-container" style="max-width:800px;margin:0 auto;padding:4rem 1.5rem;">

    <div class="section-title" style="margin-bottom:2rem;">📊 Hasil Quiz</div>

    <div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;padding:2rem;text-align:center;">
      
      <div style="font-size:4rem;margin-bottom:1rem;" th:if="${postScore * 10 >= 70}">🎉</div>
      <div style="font-size:4rem;margin-bottom:1rem;" th:if="${postScore * 10 >= 50 and postScore * 10 < 70}">👍</div>
      <div style="font-size:4rem;margin-bottom:1rem;" th:if="${postScore * 10 < 50}">📚</div>

      <h3 style="font-family:'Syne',sans-serif;margin-bottom:1.5rem;">Nilai Kamu: <strong th:text="${postScore * 10}"></strong></h3>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1.5rem 0;">
        <div style="background:var(--green);color:white;padding:0.75rem;border-radius:8px;">
          ✅ Benar<br>
          <strong style="font-size:1.5rem;" th:text="${postScore}"></strong>
        </div>
        <div style="background:var(--coral);color:white;padding:0.75rem;border-radius:8px;">
          ❌ Salah<br>
          <strong style="font-size:1.5rem;" th:text="${totalSoal - postScore}"></strong>
        </div>
      </div>

      <p style="color:var(--text-muted);margin-top:1rem;">Total Soal: <strong th:text="${totalSoal}"></strong></p>

      <div style="margin-top:2rem;">
        <a href="/modules" class="btn-primary" style="text-decoration:none;">📚 Kembali ke Modul</a>
      </div>

    </div>

  </div>
</div>

<script src="/js/main.js"></script>
</body>
</html>
